name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod already owns the Go version; restating it here is how the
          # two drift apart.
          go-version-file: go.mod
      # The same target a contributor runs, rather than a second copy of it.
      - run: make check
